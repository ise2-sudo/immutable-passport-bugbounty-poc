<!DOCTYPE html>
  <html>
  <head>
  <meta charset="utf-8" />
  <title>Passport XSS Test Client</title>
</head>
<body>
<h1>Passport XSS Test Client</h1>
<button id="loginBtn">Log in with Immutable Passport</button>
<button id="connectBtn">Connect EVM</button>
<button id="signBtn">Sign test message</button>
<pre id="out"></pre>

<script type="module">
const { passport, config } = await import('https://cdn.jsdelivr.net/npm/@imtbl/sdk/+esm');

const CLIENT_ID = '2ebJhPgCZKjSj6JZDJrtfgAAyRoy6a6X';
const BASE = location.origin + location.pathname.replace(/index\.html$/, '');

const p = new passport.Passport({
baseConfig: {
environment: config.Environment.PRODUCTION,
publishableKey: 'pk_imapik-y1hxz81yNwmn$uK@favq',
},
clientId: CLIENT_ID,
redirectUri: BASE + 'callback.html',
logoutRedirectUri: BASE + 'callback.html',
audience: 'platform_api',
scope: 'openid offline_access email transact',
});

window.__passport = p;
let provider = null;
let account = null;

document.getElementById('loginBtn').onclick = async () => {
try {
await p.login();
document.getElementById('out').textContent = 'Logged in.';
} catch (e) {
document.getElementById('out').textContent = 'ERROR: ' + e.message;
}
};

document.getElementById('connectBtn').onclick = async () => {
try {
provider = await p.connectEvm();
window.__provider = provider;
const accounts = await provider.request({ method: 'eth_requestAccounts' });
account = accounts[0];
document.getElementById('out').textContent = 'Connected: ' + account;
} catch (e) {
document.getElementById('out').textContent = 'ERROR: ' + e.message;
}
};

document.getElementById('signBtn').onclick = async () => {
try {
if (!provider || !account) {
document.getElementById('out').textContent = 'Connect EVM first.';
return;
}
const msg = 'hello passport xss test';
const hex = '0x' + Array.from(new TextEncoder().encode(msg)).map(b => b.toString(16).padStart(2, '0')).join('');
const result = await provider.request({ method: 'personal_sign', params: [hex, account] });
document.getElementById('out').textContent = 'Signature: ' + result;
} catch (e) {
document.getElementById('out').textContent = 'ERROR: ' + e.message;
}
};
</script>
</body>
</html>
