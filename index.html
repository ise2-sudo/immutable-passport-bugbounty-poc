<!DOCTYPE html>
  <html>
  <head>
  <meta charset="utf-8" />
  <title>Passport XSS Test Client</title>
</head>
<body>
<h1>Passport XSS Test Client</h1>
<button id="loginBtn">Log in with Immutable Passport</button>
<pre id="out"></pre>

<script type="module">
const { passport, config } = await import('https://cdn.jsdelivr.net/npm/@imtbl/sdk/+esm');

const CLIENT_ID = '2ebJhPgCZKjSj6JZDJrtfgAAyRoy6a6X';
const BASE = location.origin + location.pathname.replace(/index\.html$/, '');

const p = new passport.Passport({
baseConfig: {
environment: config.Environment.PRODUCTION,
publishableKey: 'pk_imapik-y1hxz81yNwmn$uK@favq',
},
clientId: CLIENT_ID,
redirectUri: BASE + 'callback.html',
logoutRedirectUri: BASE + 'callback.html',
audience: 'platform_api',
scope: 'openid offline_access email transact',
});

window.__passport = p;

document.getElementById('loginBtn').onclick = async () => {
try {
await p.login();
} catch (e) {
document.getElementById('out').textContent = 'ERROR: ' + e.message;
}
};
</script>
</body>
</html>
